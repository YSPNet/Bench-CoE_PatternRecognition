features:
  root: outputs/bench_coe_query/features
  format: numpy_npy_plus_jsonl_indices
  save_every_batches: 25
  shard_rule: row_index_mod_world_size
  full_expected_rows: 30540
  signature_fields:
    - model_identity_and_revision
    - model_and_processor_config_hashes
    - chat_or_prompt_template
    - pooling_and_hidden_layer
    - dtype_and_attention
    - image_processor_parameters
    - implementation_source_hash

scheduling:
  available_target_gpus: 8
  target_gpu_model: NVIDIA RTX A6000
  feature_extraction:
    world_size: 8
    strategy: independent_model_per_rank_no_DDP
    backbone_order: [tinyllava, qwen3vl]
  five_seed_training:
    mapping: {0: 0, 1: 1, 2: 2, 3: 3, 4: 4}
    single_seed_ddp: forbidden
  oom_batch_ladder:
    bert: [64, 32, 16, 8]
    tinyllava: [8, 4, 2, 1]
    qwen3vl: [4, 2, 1]

safety:
  RUN_FULL: 0
  RUN_API_REGEN: 0
  offline_only: true
  minimum_full_run_free_disk_percent: 20
  smoke_limits: {train: 64, dev: 32, test: 64, epochs: 1}
  full_run_requires_quality_gate: true
  output_root: outputs/bench_coe_query

requires_human_approval:
  - authoritative_original_benchcoe_root_and_revision
  - adapted_tinyllava_pooling_and_processor_contract
  - adapted_qwen3vl_chat_template_and_pooling_contract
  - explicit_policy_for_47_genuine_multi_image_samples
  - full_run_after_quality_gate_and_disk_cleanup
