experts:
  canonical_order:
    - GPT4o
    - GeminiFlash2-5
    - Gemma3-27B
    - InternVL2_5-78B
    - Janus-Pro-1B
    - Janus-Pro-7B
    - Kimi-VL-A3B-Thinking-2506
    - MiMo-VL-7B-RL
    - Phi-3.5-Vision
    - Pixtral-12B
    - Qianfan-VL-8B
    - Qwen2.5-VL-32B-Instruct
    - Qwen2.5-VL-72B-Instruct
    - SmolVLM2
    - deepseek_vl2
    - deepseek_vl2_tiny
    - llava_next_vicuna_7b
  api_expert_ids:
    openai: GPT4o
    google: GeminiFlash2-5

labels:
  name: hard_global_best_among_correct
  statistics_source: train_only
  expert_priority: descending_train_accuracy
  tie_break: ascending_canonical_model_index
  all_wrong_policy: exclude_from_ce
  ignore_index: -100
  class_weights: null
  oversampling: false
  load_balancing: false

evaluation:
  primary_metric: routed_accuracy
  routed_accuracy_definition: mean(Y[row_index, predicted_expert_index])
  auxiliary_metrics:
    - average_cost
    - official_rank_score
    - hard_label_accuracy_non_all_wrong
    - per_dataset_micro_and_macro
    - expert_usage_entropy_and_gini
    - difficulty_strata
  rank_score_implementation: routers.utils.rank_score.rank_score
  cost_bounds_path: data/matrices/cost_bounds.json
  checkpoint_selection:
    split: dev
    monitor: dev_hard_label_loss
    mode: min
    test_allowed: false

reproducibility:
  seeds: [0, 1, 2, 3, 4]
  deterministic_sharding: row_index_mod_world_size
  prediction_before_evaluation: true
  manifest_environment_whitelist:
    - RUN_FULL
    - RUN_API_REGEN
    - CUDA_VISIBLE_DEVICES
    - HF_HUB_OFFLINE
    - TRANSFORMERS_OFFLINE
    - BERT_ROUTER_PATH
    - TINYLLAVA_ROUTER_PATH
    - QWEN3VL_ROUTER_PATH
    - BENCHCOE_ORIGINAL_ROOT

